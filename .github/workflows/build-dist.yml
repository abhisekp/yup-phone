name: Refresh dist
on:
  # The trusted base workflow supports Dependabot too. Only same-repository
  # branches build, with a read-only token and no persisted credentials.
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      branch:
        description: Repository branch whose checked-in bundles should be refreshed
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dist-${{ github.event.pull_request.number || inputs.branch }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.branch }}
          persist-credentials: false
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regenerated-dist
          path: dist
          retention-days: 1
  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Replace generated files
        run: rm -rf -- dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: regenerated-dist
          path: dist
      - name: Commit refreshed bundles and run checks on the resulting commit
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || inputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- dist
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'build: :package: refresh distribution bundles'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          gh workflow run ci.yml --ref "$HEAD_BRANCH"
          gh workflow run codeql-analysis.yml --ref "$HEAD_BRANCH"
