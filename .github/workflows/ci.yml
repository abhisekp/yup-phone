name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    name: Node ${{ matrix.node }} / Yup ${{ matrix.yup }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        yup: ['0.32.11', '1.0.0', 'latest']
        os: [ubuntu-latest]
        include:
          - { node: 24, yup: '0.32.11', os: windows-latest }
          - { node: 24, yup: 'latest', os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts yup@${{ matrix.yup }}
      - run: npm run check
      - run: npm run test:baseline
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - name: Check the PR title's commit format
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/lint-pr-title.mjs
      - name: Check workflow syntax and expressions
        uses: docker://rhysd/actionlint:1.7.12
      - run: npm audit --audit-level=low
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run build
      - name: Verify checked-in distribution files
        run: git diff --exit-code -- dist
      - run: npm run benchmark
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-and-package
          path: |
            benchmarks/results
            dist
          retention-days: 30
