name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry publishing (leave empty for normal releases)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-master
  cancel-in-progress: false
jobs:
  verify:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=low
      - run: npm run benchmark
  release:
    if: inputs.tag == ''
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}
      - name: Run checks and refresh bundles on the generated release PR
        if: steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != ''
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(printf '%s' "$RELEASE_PR" | jq -er '.number | select(type == "number")')
          PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          printf '%s' "$PR" | jq -e --arg repo "$GITHUB_REPOSITORY" '.state == "open" and .base.ref == "master" and .head.repo.full_name == $repo and (.head.ref | startswith("release-please--"))' >/dev/null
          HEAD_BRANCH=$(printf '%s' "$PR" | jq -er '.head.ref')
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          gh workflow run codeql-analysis.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          gh workflow run build-dist.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH" --field branch="$HEAD_BRANCH"
  prepare:
    needs: release
    if: always() && (needs.release.outputs.released == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    outputs:
      manifest-sha256: ${{ steps.package.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || needs.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify release tag and master ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag }}
        run: node scripts/verify-release.mjs
      - run: npm run check
      - name: Verify checked-in bundles
        run: git diff --exit-code -- dist
      - run: npm audit --audit-level=low
      - run: npm run benchmark
      - name: Pack tested files and bind their checksums to the release commit
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag }}
        run: npm run release:prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-release
          path: .release-artifacts/*
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
  publish:
    needs: [release, prepare]
    if: always() && needs.prepare.result == 'success' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      # Run only first-party publication code from the workflow revision, never
      # scripts from an arbitrary retry tag or the transferred build artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-release
          path: .release-artifacts
      - name: Publish with npm trusted publishing
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag }}
          RELEASE_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
        run: npm run release:publish
      - name: Attach package and benchmark evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" .release-artifacts/yup-phone-*.tgz .release-artifacts/latest.json .release-artifacts/latest.md .release-artifacts/manifest.json --clobber
